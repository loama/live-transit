# Weekly refresh of static GTFS catalogs (lines, stops, route geometry). Runs here rather than as a Vercel cron
# because some national feeds take longer to download and parse than a serverless function may run, and timetable
# licences require serving current data. Unchanged feeds are detected from their zip directory and skipped.
name: Static GTFS refresh

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: static-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun scripts/import-static.ts --concurrency=4 --timeout=3600 --budget=330
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          SPAIN_NAP_API_KEY: ${{ secrets.SPAIN_NAP_API_KEY }}
          AUSTRIA_MVB_EMAIL: ${{ secrets.AUSTRIA_MVB_EMAIL }}
          AUSTRIA_MVB_PASSWORD: ${{ secrets.AUSTRIA_MVB_PASSWORD }}
