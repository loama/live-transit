# Weekly discovery of new GTFS feeds and coverage gaps, proposing validated additions as a pull request.
name: Source discovery

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

concurrency:
  group: source-discovery
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile

      - name: Download Natural Earth data and the Transitland Atlas
        run: |
          NE=https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson
          mkdir -p /tmp/ne
          curl -fsSL "$NE/ne_10m_admin_0_countries.geojson" -o /tmp/ne/countries.geojson
          curl -fsSL "$NE/ne_10m_admin_1_states_provinces.geojson" -o /tmp/ne/admin1.geojson
          curl -fsSL "$NE/ne_10m_populated_places_simple.geojson" -o /tmp/ne/places.geojson
          git clone -q --depth 1 https://github.com/transitland/transitland-atlas.git /tmp/atlas

      - name: Generate catalogs
        run: |
          bun scripts/gen-global-gtfs.ts
          bun scripts/gen-schedule-feeds.ts
          bun scripts/gen-extra-feeds.ts
          bun scripts/normalize-extra-feeds.ts /tmp/atlas /tmp/ne
          bun scripts/gen-more-feeds.ts

      - name: Fetch portal feeds
        run: |
          bun scripts/gen-nap-es.ts /tmp/ne
          bun scripts/gen-mvb-at.ts /tmp/ne
        env:
          SPAIN_NAP_API_KEY: ${{ secrets.SPAIN_NAP_API_KEY }}
          AUSTRIA_MVB_EMAIL: ${{ secrets.AUSTRIA_MVB_EMAIL }}
          AUSTRIA_MVB_PASSWORD: ${{ secrets.AUSTRIA_MVB_PASSWORD }}

      - name: Keep existing networks and deduplicate
        run: |
          bun scripts/keep-existing-feeds.ts HEAD /tmp/existing-ids.txt
          bun scripts/dedupe-static-feeds.ts /tmp/existing-ids.txt

      - name: Fix countries and identify gaps
        run: |
          bun scripts/fix-countries.ts /tmp/ne
          bun scripts/coverage-gaps.ts /tmp/ne/admin1.geojson /tmp/coverage-gaps.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run discovery agent
        run: |
          set -o pipefail
          bun add -g @anthropic-ai/claude-code
          claude -p "$(cat .github/prompts/source-discovery.md)" \
            --max-budget-usd 2.0 \
            --add-dir /tmp \
            --allowedTools Read Grep Glob WebSearch WebFetch "Edit(scripts/discovery-candidates.json)" \
            | tee /tmp/discovery-report.md
          cat /tmp/discovery-report.md >> "$GITHUB_STEP_SUMMARY"
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_MODEL: anthropic/claude-sonnet-5.5

      - name: Validate candidates
        run: bun scripts/validate-candidates.ts

      - name: Create pull request
        run: |
          if git diff --quiet src/connectors; then
            echo "No changes to commit"
            exit 0
          fi

          BRANCH="chore/source-discovery-$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          git add src/connectors/global-gtfs/feeds.json
          git add src/connectors/schedule/*.json
          git add src/connectors/static-gtfs.json

          bun scripts/registry-diff.ts HEAD > /tmp/registry-diff.md
          { cat /tmp/registry-diff.md; printf '\n## Discovery agent\n\n'; cat /tmp/discovery-report.md; } > /tmp/pr-body.md
          git commit -m "chore: update source registries" -m "$(head -1 /tmp/registry-diff.md)"

          git fetch -q origin main && git rebase -q --autostash origin/main

          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BRANCH"

          gh pr create --head "$BRANCH" \
            --title "Source discovery: $(date +%Y-%m-%d)" \
            --assignee loama \
            --body-file /tmp/pr-body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
